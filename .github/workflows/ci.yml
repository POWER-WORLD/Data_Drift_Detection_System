name: CI/CD Pipeline & Security Assurance

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  code-quality:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black isort

      - name: Check Code Formatting (Black)
        run: |
          black --check --diff src api tests

      - name: Check Import Order (isort)
        run: |
          isort --check-only --diff src api tests

      - name: Lint Codebase (flake8)
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 src api tests --count --select=E9,F63,F7,F82 --show-source --statistics
          # Warning-level linting for enterprise standards
          flake8 src api tests --count --max-complexity=15 --max-line-length=120 --statistics

  security-scan:
    name: Cybersecurity & Vulnerability Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Security Scanners
        run: |
          python -m pip install --upgrade pip
          pip install bandit pip-audit

      - name: Run Bandit AST Security Scan
        run: |
          # Audit src and api for OWASP Top 10 vulnerabilities
          bandit -r src api -ll -ii

      - name: Audit Dependencies for Known CVEs (pip-audit)
        run: |
          pip-audit -r requirements.txt

  type-check:
    name: Static Type Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install mypy

      - name: Run Mypy Type Checker
        run: |
          mypy --ignore-missing-imports --no-strict-optional src/

  test-suite:
    name: Automated Test Suite & Coverage
    runs-on: ubuntu-latest
    needs: [code-quality, security-scan, type-check]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run Pytest with Coverage
        run: |
          pytest --cov=src --cov-report=xml --cov-report=term-missing tests/

      - name: Upload Test Coverage Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 14

  docker-verification:
    name: Docker Build & Security Verification
    runs-on: ubuntu-latest
    needs: [test-suite]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Hardened Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: ddd-system:latest
          load: true

      - name: Verify Non-Root User Execution
        run: |
          USER_ID=$(docker run --rm ddd-system:latest id -u)
          if [ "$USER_ID" != "10001" ]; then
            echo "Security Error: Container running as UID $USER_ID instead of 10001!"
            exit 1
          fi
          echo "Verified: Container correctly executes under unprivileged UID 10001."
