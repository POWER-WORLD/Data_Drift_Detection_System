# ==============================================================================
# Netlify Deployment & Security Configuration
# System URL: https://dddsystem.vercel.app (primary production deployment)
# ==============================================================================

[build]
  publish = "public"
  command = "echo 'Static assets ready'"

# Global HTTP Security Headers
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self' 'unsafe-inline' 'unsafe-eval' https: data: blob:; object-src 'none'; base-uri 'self';"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

# Canonical redirect to primary production deployment at https://dddsystem.vercel.app
[[redirects]]
  from = "/*"
  to = "https://dddsystem.vercel.app/:splat"
  status = 301
  force = false
